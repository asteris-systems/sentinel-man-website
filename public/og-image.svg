<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#001F3F"/>
      <stop offset="100%" stop-color="#000F1F"/>
    </linearGradient>
    <linearGradient id="goldRail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFDC00" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFDC00" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FFDC00" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#FFDC00" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFDC00" stop-opacity="0"/>
    </radialGradient>
    <symbol id="shield" viewBox="0 0 512 512">
      <path d="M256 32
               C 256 32, 200 38, 144 50
               C 110 56, 88 60, 64 64
               L 64 232
               C 64 308, 100 372, 158 416
               C 188 438, 220 456, 240 466
               C 248 470, 252 472, 256 472
               C 260 472, 264 470, 272 466
               C 292 456, 324 438, 354 416
               C 412 372, 448 308, 448 232
               L 448 64
               C 424 60, 402 56, 368 50
               C 312 38, 256 32, 256 32 Z" fill="currentColor"/>
    </symbol>
  </defs>

  <!-- Navy gradient background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#FFDC00" stroke-width="1">
    <line x1="0" y1="105"  x2="1200" y2="105"/>
    <line x1="0" y1="210"  x2="1200" y2="210"/>
    <line x1="0" y1="315"  x2="1200" y2="315"/>
    <line x1="0" y1="420"  x2="1200" y2="420"/>
    <line x1="0" y1="525"  x2="1200" y2="525"/>
    <line x1="240" y1="0"  x2="240"  y2="630"/>
    <line x1="480" y1="0"  x2="480"  y2="630"/>
    <line x1="720" y1="0"  x2="720"  y2="630"/>
    <line x1="960" y1="0"  x2="960"  y2="630"/>
  </g>

  <!-- Gold top line -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#goldRail)"/>

  <!-- Hero shield (right side) — radial glow + big shield -->
  <ellipse cx="935" cy="300" rx="290" ry="290" fill="url(#shieldGlow)"/>
  <g transform="translate(740, 90)" color="#FFDC00">
    <use href="#shield" width="400" height="400"/>
  </g>

  <!-- Brand mark (top-left): small shield + wordmark -->
  <g transform="translate(72, 70)" color="#FFDC00">
    <use href="#shield" width="48" height="48"/>
  </g>
  <text x="138" y="92"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="17" font-weight="600" fill="#FFDC00"
        letter-spacing="3.4">SENTINEL MAN</text>
  <text x="138" y="114"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="11" fill="#8BA4C8"
        letter-spacing="2.4">PERFORMANCE INTELLIGENCE</text>

  <!-- Main headline -->
  <text x="72" y="240"
        font-family="'Rubik', 'Helvetica Neue', Arial, sans-serif"
        font-size="60" font-weight="700"
        fill="#F1F5F9" letter-spacing="-1.2">Performance</text>
  <text x="72" y="312"
        font-family="'Rubik', 'Helvetica Neue', Arial, sans-serif"
        font-size="60" font-weight="700"
        fill="#FFDC00" letter-spacing="-1.2">intelligence</text>
  <text x="72" y="384"
        font-family="'Rubik', 'Helvetica Neue', Arial, sans-serif"
        font-size="60" font-weight="700"
        fill="#F1F5F9" letter-spacing="-1.2">for high-stakes men.</text>

  <!-- Descriptor -->
  <text x="72" y="442"
        font-family="'Rubik', 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="400" fill="#C2D6EF">Daily brief &#183; Decision analysis &#183; Pattern intelligence &#183; 90-day arc</text>

  <!-- Divider -->
  <line x1="72" y1="478" x2="640" y2="478" stroke="#FFDC00" stroke-width="1" opacity="0.3"/>

  <!-- Stats row -->
  <text x="72"  y="528" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="36" font-weight="700" fill="#FFDC00">26s</text>
  <text x="72"  y="556" font-family="'Rubik', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8BA4C8">Decision analysis</text>

  <text x="240" y="528" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="36" font-weight="700" fill="#FFDC00">90</text>
  <text x="240" y="556" font-family="'Rubik', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8BA4C8">Day arc</text>

  <text x="380" y="528" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="36" font-weight="700" fill="#FFDC00">19</text>
  <text x="380" y="556" font-family="'Rubik', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8BA4C8">Clinical modalities</text>

  <!-- URL badge -->
  <rect x="500" y="510" width="200" height="42" rx="6" fill="none" stroke="#FFDC00" stroke-width="1" opacity="0.45"/>
  <text x="600" y="538" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" fill="#FFDC00" text-anchor="middle" letter-spacing="1.2">sentinelman.com</text>

  <!-- Bottom positioning strip -->
  <rect x="0" y="594" width="1200" height="36" fill="#FFDC00" opacity="0.06"/>
  <line x1="0" y1="594" x2="1200" y2="594" stroke="#FFDC00" stroke-width="1" opacity="0.2"/>
  <text x="600" y="617" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#FFDC00" text-anchor="middle" letter-spacing="4" opacity="0.75">PERFORMANCE INTELLIGENCE &#183; NOT WELLNESS &#183; NOT COACHING &#183; NOT A CHAT APP</text>
</svg>
